<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Fitness Tracker</title>
<style>
    body { font-family: Poppins, sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; background:#222; color:white; }
    .container { background:rgba(0,0,0,0.8); padding:30px; border-radius:15px; width:300px; text-align:center; }
    input { width:100%; padding:10px; margin:10px 0; border-radius:8px; border:none; }
    button { width:100%; padding:10px; border:none; border-radius:8px; background:#ff914d; color:white; font-weight:bold; cursor:pointer; }
    button:hover { background:#e67e22; }
    p { margin:5px 0; }
    a { color:#ff914d; text-decoration:none; }
</style>
</head>
<body>

<div class="container">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="login()">Login</button>
    <p id="message"></p>
    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script>
function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const message = document.getElementById("message");

    const users = JSON.parse(localStorage.getItem("users") || "{}");

    if (users[username] && users[username].password === password) {
        // Save logged-in user
        localStorage.setItem("loggedInUser", JSON.stringify({ username }));
        window.location.href = "main.html";
    } else {
        message.style.color = "red";
        message.textContent = "Invalid username or password!";
    }
}
</script>

</body>
</html>
