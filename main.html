<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔐 Session Protection -->
<script>
    const loggedUser = JSON.parse(localStorage.getItem("loggedInUser"));
    if (!loggedUser) {
        window.location.href = "login.html";
    }
</script>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">
        <img src="images/logo.png" alt="Fitness Tracker Logo">
    </div>
    <div class="nav-links">
        <a href="main.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</div>

<!-- Welcome -->
<div class="welcome" id="welcomeText"></div>

<!-- Hero -->
<div class="container">
    <h1>Track Your Fitness Journey</h1>
    <p>Manage your workouts, set goals, and stay fit.</p><br><br>
    <button class="button" onclick="window.location.href='select_route.html'">
        Select Your Fitness Route
    </button>
</div>

<!-- Daily Goals -->
<div class="section" id="dailyGoalSection"></div>

<!-- Badges -->
<div class="section">
    <h2>Achievements & Badges</h2>
    <div id="badges"></div>
</div>

<!-- Leaderboard -->
<div class="section leaderboard">
    <h2>Leaderboard</h2>
    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>User</th>
                <th>Points</th>
            </tr>
        </thead>
        <tbody id="leaderboard"></tbody>
    </table>
</div>

<!-- Footer -->
<footer>
    <p>&copy; 2025 Fitness Tracker. All rights reserved.</p>
    <div class="social-icons">
        <a href="https://www.linkedin.com/in/sujal-chavan-672b982b4/" aria-label="LinkedIn">
            <i class="ri-linkedin-line"></i>
        </a>
        <a href="https://github.com/Chavansujal" aria-label="GitHub">
            <i class="ri-github-line"></i>
        </a>
        <a href="https://www.instagram.com/sujalll_13?" aria-label="Instagram">
            <i class="ri-instagram-line"></i>
        </a>
    </div>
</footer>

<script>
/* ---------------- USER ---------------- */
const userEmail = loggedUser.email;
document.getElementById("welcomeText").innerText = `Welcome, ${userEmail} 👋`;

/* ---------------- STATS ---------------- */
const dailyGoal = 500;
const todayBurned = Math.floor(Math.random() * 400) + 200;
const streak = Math.floor(Math.random() * 10) + 1;

document.getElementById("dailyGoalSection").innerHTML = `
    <h2>Daily Goal</h2>
    <p>Goal: ${dailyGoal} Calories</p>
    <p>Burned Today: ${todayBurned} Calories</p>
    <p>Status: ${todayBurned >= dailyGoal ? "✅ Goal Achieved!" : "⏳ Keep Going!"}</p>
    <p>Streak: 🔥 ${streak} Days</p>
`;

/* ---------------- BADGES ---------------- */
const badges = [];
if (todayBurned >= dailyGoal) badges.push("✅ Daily Goal Achieved");
if (streak >= 7) badges.push("💪 15-Day Streak");
if (todayBurned > 1000) badges.push("🔥 1000 Calories in a Day");

const badgeContainer = document.getElementById("badges");

if (badges.length > 0) {
    badges.forEach(badge => {
        const span = document.createElement("span");
        span.className = "badge";
        span.innerText = badge;
        badgeContainer.appendChild(span);
    });
} else {
    badgeContainer.innerHTML = "<p>No badges yet. Keep working out!</p>";
}

/* ---------------- LEADERBOARD ---------------- */
const leaderboardData = [
    { name: userEmail, points: Math.floor(Math.random() * 1000) + 1000 },
    { name: "Raj", points: 1200 },
    { name: "Ananya", points: 1000 }
];

const leaderboardTable = document.getElementById("leaderboard");

leaderboardData.forEach((player, index) => {
    const row = `
        <tr>
            <td>${index + 1}</td>
            <td>${player.name}</td>
            <td>${player.points}</td>
        </tr>
    `;
    leaderboardTable.innerHTML += row;
});

/* ---------------- LOGOUT ---------------- */
function logout() {
    localStorage.removeItem("loggedInUser");
    window.location.href = "login.html";
}
</script>

</body>
</html>
