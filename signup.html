<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up - Fitness Tracker</title>
<style>
    body { font-family: Poppins, sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; background:#222; color:white; }
    .container { background:rgba(0,0,0,0.8); padding:30px; border-radius:15px; width:300px; text-align:center; }
    input { width:100%; padding:10px; margin:10px 0; border-radius:8px; border:none; }
    button { width:100%; padding:10px; border:none; border-radius:8px; background:#ff914d; color:white; font-weight:bold; cursor:pointer; }
    button:hover { background:#e67e22; }
    p { margin:5px 0; }
    a { color:#ff914d; text-decoration:none; }
</style>
</head>
<body>

<div class="container">
    <h2>Create Account</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="signup()">Sign Up</button>
    <p id="message"></p>
    <p>Already have an account? <a href="login.html">Login</a></p>
</div>

<script>
function signup() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const message = document.getElementById("message");

    if (!username || !password) { message.textContent = "All fields required!"; return; }

    // Get stored users or empty object
    const users = JSON.parse(localStorage.getItem("users") || "{}");

    if (users[username]) {
        message.textContent = "Username already exists!";
        return;
    }

    // Save user (password stored in plain text for simplicity, can hash with JS if needed)
    users[username] = { password: password };
    localStorage.setItem("users", JSON.stringify(users));

    message.style.color = "green";
    message.textContent = "Account created successfully!";
    
    // Redirect to login after 1.5 sec
    setTimeout(() => { window.location.href = "login.html"; }, 1500);
}
</script>

</body>
</html>
